<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CGPA Calculator</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .auth-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 2rem;
        background: var(--surface-raised);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        text-align: center;
      }
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .auth-form input {
        padding: 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        background: var(--surface-ground);
        color: var(--text-primary);
        font-family: inherit;
      }
      .auth-form button {
        width: 100%;
        margin-top: 0.5rem;
      }
      .toggle-auth {
        margin-top: 1rem;
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }
      .toggle-auth a {
        color: var(--accent-primary);
        cursor: pointer;
        text-decoration: underline;
      }
      #errorMessage {
        color: var(--accent-fail);
        font-size: var(--text-sm);
        margin-top: 0.5rem;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <main>
        <div class="auth-container">
          <h2 id="authTitle">Welcome Back</h2>
          <p class="text-secondary" id="authSubtitle">Login to track your CGPA</p>
          
          <div id="errorMessage"></div>

          <form id="authForm" class="auth-form">
            <input type="email" id="email" placeholder="Email Address" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit" class="primary-button" id="submitBtn">Login</button>
          </form>

          <p class="toggle-auth">
            <span id="toggleText">Don't have an account?</span> 
            <a id="toggleBtn">Sign up</a>
          </p>
        </div>
      </main>
    </div>

    <script>
      let isLogin = true;
      const authForm = document.getElementById('authForm');
      const authTitle = document.getElementById('authTitle');
      const authSubtitle = document.getElementById('authSubtitle');
      const submitBtn = document.getElementById('submitBtn');
      const toggleText = document.getElementById('toggleText');
      const toggleBtn = document.getElementById('toggleBtn');
      const errorMessage = document.getElementById('errorMessage');

      toggleBtn.addEventListener('click', () => {
        isLogin = !isLogin;
        errorMessage.textContent = '';
        if (isLogin) {
          authTitle.textContent = 'Welcome Back';
          authSubtitle.textContent = 'Login to track your CGPA';
          submitBtn.textContent = 'Login';
          toggleText.textContent = "Don't have an account?";
          toggleBtn.textContent = 'Sign up';
        } else {
          authTitle.textContent = 'Create Account';
          authSubtitle.textContent = 'Sign up to start tracking';
          submitBtn.textContent = 'Register';
          toggleText.textContent = "Already have an account?";
          toggleBtn.textContent = 'Login';
        }
      });

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        errorMessage.textContent = '';

        const endpoint = isLogin ? '/api/login' : '/api/register';

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (data.success) {
            window.location.href = '/app.html';
          } else {
            errorMessage.textContent = data.error || 'Authentication failed';
          }
        } catch (err) {
          errorMessage.textContent = 'A network error occurred. Please try again.';
        }
      });
    </script>
  </body>
</html>
